[package]
name = "wwlc"
version = "1.0.0"
edition = "2021"
description = "Worm Worm Literature Club - a Rust (macroquad) visual novel"
license = "MIT"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.24", default-features = false, features = ["gif", "png", "jpeg"] }
minimp3 = "0.5"
dirs = "6"

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
